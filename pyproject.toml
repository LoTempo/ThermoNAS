[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "thermonas"
version = "1.0.0"
description = "Desktop simulator for transient conjugate heat transfer in porous TPMS channels"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Andrey Popov" }]
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "PySide6>=6.6,<7",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]
dev = ["ruff>=0.9,<1"]

[project.gui-scripts]
thermonas = "thermonas.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thermonas = [
    "models/*.npz",
    "resources/*.ui",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/thermonas/ui_main_window.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
